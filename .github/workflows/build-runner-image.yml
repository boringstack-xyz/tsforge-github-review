name: Build runner image

on:
  push:
    branches: [main]
    paths:
      - "runner-image/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        env:
          VERSIONED_TAG: 2.336.0-tsforge0.53.3
        run: |
          docker build \
            -t ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${VERSIONED_TAG} \
            -t ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${{ github.sha }} \
            runner-image

          echo "Smoke-testing the built image..."
          docker run --rm ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${VERSIONED_TAG} tsforge --version | grep -q '0.53.3' \
            || { echo "::error::tsforge --version did not report the pinned 0.53.3"; exit 1; }

          docker push ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${VERSIONED_TAG}
          docker push ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${{ github.sha }}
