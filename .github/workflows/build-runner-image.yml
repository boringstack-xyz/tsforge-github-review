name: Build runner image

on:
  push:
    branches: [main]
    paths:
      - "runner-image/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          # Read the pinned version out of the Dockerfile itself — a hardcoded
          # duplicate here has already gone stale once (image built 0.53.6
          # while this workflow still asserted 0.53.5).
          TSFORGE_VERSION=$(grep -oP '@agjs/tsforge@\K[0-9.]+' runner-image/Dockerfile)
          VERSIONED_TAG="2.336.0-tsforge${TSFORGE_VERSION}"

          docker build \
            -t ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${VERSIONED_TAG} \
            -t ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${{ github.sha }} \
            runner-image

          echo "Smoke-testing the built image..."
          docker run --rm ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${VERSIONED_TAG} tsforge --version | grep -q "${TSFORGE_VERSION}" \
            || { echo "::error::tsforge --version did not report the pinned ${TSFORGE_VERSION}"; exit 1; }

          docker push ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${VERSIONED_TAG}
          docker push ghcr.io/boringstack-xyz/tsforge-reviewer-runner:${{ github.sha }}
