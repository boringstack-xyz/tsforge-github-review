name: "tsforge-github-review (analyze)"
description: "Runs tsforge review against a checked-out PR and writes findings + diff to files, for a separate no-checkout job to post. Holds no GitHub token — see post/action.yml."
author: "boringstack-xyz"
branding:
  icon: "eye"
  color: "blue"

inputs:
  base-ref:
    description: "The PR's base branch, to diff against."
    required: true
  model-url:
    description: "Sets TSFORGE_BASE_URL for the tsforge review invocation."
    required: false
  model-id:
    description: "Sets TSFORGE_MODEL for the tsforge review invocation."
    required: false

runs:
  using: "composite"
  steps:
    # Deliberately no github-token input at all: this action checks out and
    # runs tsforge against untrusted PR content, so the calling job should
    # hold no write-scoped credentials for it to ever touch, by construction
    # — not just by convention. Post the resulting findings with
    # post/action.yml, in a separate job that never checks out code. See
    # README.md for the full split rationale.
    #
    # A composite action's OWN steps don't get INPUT_* env vars automatically
    # (that's a Docker/JS-action convention) — bridge inputs -> the env names
    # src/analyze.ts reads via process.env, explicitly, in one place.
    - name: Run tsforge review, write findings + diff
      shell: bash
      env:
        INPUT_BASE-REF: ${{ inputs.base-ref }}
        INPUT_MODEL-URL: ${{ inputs.model-url }}
        INPUT_MODEL-ID: ${{ inputs.model-id }}
      run: bun run "${{ github.action_path }}/src/analyze.ts"
